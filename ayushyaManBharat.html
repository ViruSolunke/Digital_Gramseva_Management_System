<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PM-JAY | Ayushman Bharat Chincholi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0f766e; --secondary: #2563eb; }
        body { 
            font-family: 'Outfit', sans-serif; 
            background: #f8fafc;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(15, 118, 110, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(37, 99, 235, 0.05) 0%, transparent 40%);
        }

        .gov-header {
            background: white;
            border-bottom: 4px solid #0f766e;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        .hospital-card {
            background: white;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid #f1f5f9;
        }

        .hospital-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 30px 60px -15px rgba(15, 118, 110, 0.15);
            border-color: #0f766e;
        }

        .search-glow:focus-within {
            box-shadow: 0 0 25px rgba(37, 99, 235, 0.2);
            border-color: #2563eb;
        }

        .badge-verified {
            background: linear-gradient(90deg, #dcfce7 0%, #f0fdf4 100%);
            color: #15803d;
            border: 1px solid #bbf7d0;
        }

        @media print {
            .no-print { display: none !important; }
            #detailModal { position: absolute; top: 0; left: 0; width: 100%; display: block !important; }
        }
    </style>
</head>
<body class="min-h-screen">

    <nav class="no-print gov-header py-4 px-6 md:px-10 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-4">
            <img src="https://upload.wikimedia.org/wikipedia/commons/5/55/Emblem_of_India.svg" class="h-12 md:h-14">
            <div class="h-10 w-[2px] bg-slate-200 hidden sm:block"></div>
            <div>
                <h1 class="text-xl md:text-2xl font-black text-slate-800 tracking-tighter leading-none">PM-JAY <span class="text-teal-700">AYUSHMAN</span></h1>
                <p class="text-[9px] md:text-[10px] font-bold text-slate-500 uppercase tracking-widest mt-1">National Health Authority | Govt. of India</p>
            </div>
        </div>

        <div class="flex items-center gap-3 md:gap-6">
            <div class="text-right hidden lg:block">
                <p class="text-[10px] font-black text-teal-700 uppercase">Emergency Helpline</p>
                <p class="text-lg font-black text-slate-800">14555 / 1800-111-565</p>
            </div>
            
            <div class="bg-teal-700 text-white p-3 rounded-2xl hidden sm:block">
                <i class="fas fa-hand-holding-medical text-xl"></i>
            </div>
             <a href="schemes.html" class="bg-white text-green-900 border-2 border-green-900 px-8 py-3 rounded-2xl font-black text-sm uppercase tracking-widest hover:bg-green-900 hover:text-white transition-all">
            <i class="fas fa-arrow-left mr-2"></i> Back
        </a>
         
        </div>
    </nav>

    <main class="max-w-7xl mx-auto pt-16 px-6">
        <div class="grid lg:grid-cols-2 gap-12 items-center mb-20">
            <div>
                <h2 class="text-6xl font-[900] text-slate-800 leading-[1.1] mb-6 tracking-tighter">
                    Find Hospital in <br><span class="text-teal-700">Chincholi Village</span>
                </h2>
                <p class="text-lg text-slate-500 font-medium mb-10">Cashless medical facilities for Ayushman Card holders under PM-JAY scheme.</p>
                
                <div class="search-glow bg-white p-2 rounded-[2.5rem] flex items-center shadow-xl border-2 border-slate-100 transition-all">
                    <i class="fas fa-search text-slate-300 ml-6 mr-4 text-xl"></i>
                    <input type="text" id="hSearch" onkeyup="searchHospitals()" placeholder="Search Doctor or Hospital..." 
                           class="w-full py-4 text-lg font-bold outline-none bg-transparent">
                    <button class="bg-teal-700 text-white px-8 py-4 rounded-[2rem] font-black uppercase text-xs tracking-widest hover:bg-teal-800">
                        Search
                    </button>
                </div>
            </div>
            <div class="relative no-print">
                <img src="https://cdni.iconscout.com/illustration/premium/thumb/online-hospital-location-4437299-3685350.png" class="w-full drop-shadow-2xl">
            </div>
        </div>

        <div id="hospitalGrid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
            </div>
    </main>

    <div id="detailModal" class="fixed inset-0 z-[100] hidden items-center justify-center p-4 bg-slate-900/60 backdrop-blur-md no-print">
        <div class="bg-white w-full max-w-2xl rounded-[3.5rem] overflow-hidden shadow-2xl">
            <div class="bg-teal-700 p-8 text-white flex justify-between items-center">
                <div class="text-left">
                    <h3 class="text-2xl font-black" id="mName"></h3>
                    <p class="text-xs opacity-80 uppercase font-bold tracking-widest" id="mId"></p>
                </div>
                <button onclick="closeModal()" class="text-2xl hover:text-red-300 transition-colors"><i class="fas fa-times-circle"></i></button>
            </div>
            
            <div class="p-8 grid md:grid-cols-2 gap-6 bg-slate-50">
                <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100">
                    <p class="text-[10px] font-black text-teal-600 uppercase mb-2">Primary Doctor</p>
                    <h4 class="text-xl font-black text-slate-800" id="mDoc"></h4>
                    <p class="text-xs font-bold text-slate-500 mb-4" id="mEdu"></p>
                    <div class="border-t pt-4">
                        <p class="text-[10px] font-black text-slate-400 uppercase">Consultation Fees</p>
                        <p class="text-xl font-black text-teal-700" id="mFees"></p>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100 space-y-4">
                    <div>
                        <p class="text-[10px] font-black text-slate-400 uppercase mb-1">Working Hours</p>
                        <p class="text-sm font-black text-slate-800"><i class="far fa-clock text-teal-600 mr-2"></i><span id="mTime"></span></p>
                    </div>
                    <div>
                        <p class="text-[10px] font-black text-slate-400 uppercase mb-1">Specialty</p>
                        <span class="bg-teal-50 text-teal-700 px-3 py-1 rounded-full text-[10px] font-black uppercase" id="mSpec"></span>
                    </div>
                </div>

                <div class="md:col-span-2 bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100">
                    <p class="text-[10px] font-black text-slate-400 uppercase mb-1">Hospital Location</p>
                    <p class="text-sm font-bold text-slate-600" id="mLoc"></p>
                </div>
            </div>

            <div class="p-8 bg-white flex gap-4">
                <button onclick="window.print()" class="flex-1 bg-teal-700 text-white py-4 rounded-2xl font-black uppercase text-xs tracking-widest">Download Receipt</button>
                <button onclick="closeModal()" class="flex-1 bg-slate-100 text-slate-400 py-4 rounded-2xl font-black uppercase text-xs tracking-widest">Back</button>
            </div>
        </div>
    </div>

    <script>
        const hospitals = [
            { id: "PMJAY-101", name: "Chincholi Rural Hospital", spec: "General Medicine", type: "Govt", loc: "Main Road, Chincholi Village, MH", doctor: "Dr. Arvind Kulkarni", edu: "MBBS, MD (General Medicine)", fees: "₹0 (Govt)", time: "09:00 AM - 08:00 PM" },
            { id: "PMJAY-102", name: "Lifecare Multi-Specialty", spec: "Cardiology", type: "Private", loc: "Sector 4, Near Highway, Chincholi", doctor: "Dr. Megha Patil", edu: "MBBS, MS, DNB (Cardio)", fees: "₹500 (Consult)", time: "10:00 AM - 06:00 PM" },
            { id: "PMJAY-103", name: "Sunrise Eye Clinic", spec: "Ophthalmology", type: "Private", loc: "Market Area, Chincholi", doctor: "Dr. S. Deshmukh", edu: "MBBS, DOMS (Eye Spec.)", fees: "₹300 (Consult)", time: "11:00 AM - 07:00 PM" },
            { id: "PMJAY-104", name: "Gramin Janta Hospital", spec: "Maternity", type: "Govt", loc: "Opp. Gram Panchayat, Chincholi", doctor: "Dr. Anjali More", edu: "MBBS, DGO (Gynecologist)", fees: "₹0 (Govt)", time: "24 Hours Open" },
            { id: "PMJAY-105", name: "Metro Ortho Center", spec: "Orthopedics", type: "Private", loc: "Railway Crossing Road", doctor: "Dr. Rahul Shinde", edu: "MBBS, MS (Orthopedic)", fees: "₹600 (Consult)", time: "09:00 AM - 05:00 PM" },
            { id: "PMJAY-106", name: "Apex Kidney Care", spec: "Nephrology", type: "Private", loc: "North Chincholi Bypass", doctor: "Dr. Sameer Khan", edu: "MBBS, MD, DM (Nephro)", fees: "₹800 (Consult)", time: "10:00 AM - 04:00 PM" },
            { id: "PMJAY-107", name: "Sanjeevani Clinic", spec: "Pediatrics", type: "Private", loc: "Shivaji Nagar Chowk", doctor: "Dr. Pooja Thite", edu: "MBBS, DCH (Pediatrics)", fees: "₹400 (Consult)", time: "05:00 PM - 10:00 PM" },
            { id: "PMJAY-108", name: "District Civil Hospital", spec: "Multi-Specialty", type: "Govt", loc: "District HQ, Civil Lines", doctor: "Dr. Vikas Pawar", edu: "MBBS, MS (Surgeon)", fees: "₹0 (Govt)", time: "24 Hours Open" },
            { id: "PMJAY-109", name: "Dental Trust Center", spec: "Dentistry", type: "Private", loc: "Near ZP School, Chincholi", doctor: "Dr. Amit Rathod", edu: "BDS, MDS (Dental)", fees: "₹250 (Consult)", time: "09:30 AM - 06:30 PM" },
            { id: "PMJAY-110", name: "Ayush Homeo Center", spec: "Homeopathy", type: "Govt", loc: "East Chincholi Colony", doctor: "Dr. Snehal Mane", edu: "BHMS (Homeopathy)", fees: "₹0 (Govt)", time: "10:00 AM - 05:00 PM" }
        ];

        function renderHospitals(data) {
            const grid = document.getElementById('hospitalGrid');
            grid.innerHTML = '';
            data.forEach(h => {
                grid.innerHTML += `
                    <div class="hospital-card p-8 rounded-[3rem] relative overflow-hidden group">
                        <div class="absolute top-0 right-0 p-6 opacity-[0.03] text-8xl transition-transform"><i class="fas fa-hospital-alt"></i></div>
                        <span class="badge-verified px-3 py-1 rounded-full text-[9px] font-black uppercase tracking-widest">Verified Facility</span>
                        <h3 class="text-2xl font-[900] text-slate-800 mt-4 mb-1">${h.name}</h3>
                        <p class="text-xs font-bold text-teal-700 uppercase tracking-widest mb-6">${h.spec}</p>
                        <div class="flex justify-between items-center">
                            <span class="text-[10px] font-bold text-slate-400 uppercase">${h.type} Facility</span>
                            <button onclick="viewHospital('${h.id}')" class="bg-slate-900 text-white w-12 h-12 rounded-2xl hover:bg-teal-700 transition-all flex items-center justify-center shadow-lg">
                                <i class="fas fa-chevron-right"></i>
                            </button>
                        </div>
                    </div>`;
            });
        }

        function viewHospital(id) {
            const h = hospitals.find(x => x.id === id);
            document.getElementById('mName').innerText = h.name;
            document.getElementById('mId').innerText = "Facility ID: " + h.id;
            document.getElementById('mSpec').innerText = h.spec;
            document.getElementById('mLoc').innerText = h.loc;
            document.getElementById('mDoc').innerText = h.doctor;
            document.getElementById('mEdu').innerText = h.edu;
            document.getElementById('mFees').innerText = h.fees;
            document.getElementById('mTime').innerText = h.time;
            document.getElementById('detailModal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('detailModal').style.display = 'none'; }

        function searchHospitals() {
            const val = document.getElementById('hSearch').value.toLowerCase();
            const filtered = hospitals.filter(h => 
                h.name.toLowerCase().includes(val) || 
                h.spec.toLowerCase().includes(val) || 
                h.doctor.toLowerCase().includes(val)
            );
            renderHospitals(filtered);
        }

        renderHospitals(hospitals);
    </script>
</body>
</html>
