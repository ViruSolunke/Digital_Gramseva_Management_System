<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sarkari Seva | Secure Access Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background: #f0f2f5;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23064e3b' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }
        .gov-card { 
            background: white; 
            border-top: 6px solid #064e3b; 
            border-radius: 1.5rem; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
        }
        .input-focus:focus { border-color: #064e3b; outline: none; box-shadow: 0 0 0 3px rgba(6, 78, 59, 0.1); }
        .hidden-form { display: none; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <div class="max-w-md w-full">
        <div class="text-center mb-8">
            <img src="https://upload.wikimedia.org/wikipedia/commons/5/55/Emblem_of_India.svg" class="h-20 mx-auto mb-4">
            <h1 class="text-2xl font-black text-slate-800 uppercase tracking-tighter">Government of India</h1>
            <p class="text-xs font-bold text-orange-600 uppercase tracking-widest">Unified Authentication Service</p>
        </div>

        <div class="gov-card p-10">
            
            <div id="loginSection">
                <h2 class="text-2xl font-black text-slate-800 mb-2">Sign In</h2>
                <p class="text-sm text-slate-500 mb-8 font-medium">Use your registered credentials to access the portal.</p>
                
                <form onsubmit="handleLogin(event)" class="space-y-5">
                    <div>
                        <label class="text-[10px] font-black uppercase text-slate-400 tracking-widest block mb-2">User ID / Email</label>
                        <input type="email" id="loginEmail" required class="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-xl input-focus font-bold text-slate-700">
                    </div>
                    <div>
                        <label class="text-[10px] font-black uppercase text-slate-400 tracking-widest block mb-2">Secret Password</label>
                        <input type="password" id="loginPass" required class="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-xl input-focus font-bold text-slate-700">
                    </div>
                    <button type="submit" class="w-full bg-[#064e3b] text-white py-4 rounded-xl font-black uppercase tracking-widest hover:bg-[#052e16] transition-all shadow-lg shadow-green-900/20">
                        Authorize Login
                    </button>
                </form>
                <p class="mt-8 text-center text-sm font-bold text-slate-500">
                    New User? <button onclick="toggleAuth()" class="text-blue-700 underline">Create Official Account</button>
                </p>
            </div>

            <div id="registerSection" class="hidden-form">
                <h2 class="text-2xl font-black text-slate-800 mb-2">Register</h2>
                <p class="text-sm text-slate-500 mb-8 font-medium">Create a new unique identity on the secure server.</p>
                
                <form onsubmit="handleRegister(event)" class="space-y-5">
                    <div>
                        <label class="text-[10px] font-black uppercase text-slate-400 tracking-widest block mb-2">Full Name (As per Aadhaar)</label>
                        <input type="text" id="regName" required class="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-xl input-focus font-bold text-slate-700">
                    </div>
                    <div>
                        <label class="text-[10px] font-black uppercase text-slate-400 tracking-widest block mb-2">Official Email Address</label>
                        <input type="email" id="regEmail" required class="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-xl input-focus font-bold text-slate-700">
                    </div>
                    <div>
                        <label class="text-[10px] font-black uppercase text-slate-400 tracking-widest block mb-2">Create Password</label>
                        <input type="password" id="regPass" required class="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-xl input-focus font-bold text-slate-700">
                    </div>
                    <button type="submit" class="w-full bg-blue-900 text-white py-4 rounded-xl font-black uppercase tracking-widest hover:bg-blue-800 transition-all shadow-lg shadow-blue-900/20">
                        Create Account
                    </button>
                </form>
                <p class="mt-8 text-center text-sm font-bold text-slate-500">
                    Already have an account? <button onclick="toggleAuth()" class="text-blue-700 underline">Sign In Here</button>
                </p>
            </div>
        </div>

        <div class="mt-10 text-center">
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.3em]">Secure 256-bit SSL Encryption Protected</p>
        </div>
    </div>

    <script>
        function toggleAuth() {
            document.getElementById('loginSection').classList.toggle('hidden-form');
            document.getElementById('registerSection').classList.toggle('hidden-form');
        }

        async function handleRegister(e) {
            e.preventDefault();
            const formData = new FormData();
            formData.append('fullName', document.getElementById('regName').value);
            formData.append('email', document.getElementById('regEmail').value);
            formData.append('password', document.getElementById('regPass').value);

            const response = await fetch('auth.php?action=register', { method: 'POST', body: formData });
            const data = await response.json();

            if (data.status === 'success') {
                alert("Account Created Successfully! You can now authorize your login.");
                toggleAuth();
            } else {
                alert("ACCESS DENIED: Email already registered.");
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const formData = new FormData();
            formData.append('email', document.getElementById('loginEmail').value);
            formData.append('password', document.getElementById('loginPass').value);

            const response = await fetch('auth.php?action=login', { method: 'POST', body: formData });
            const data = await response.json();

            if (data.status === 'success') {
                // Save Session
                sessionStorage.setItem('userName', data.name);
                
                // Alert and Redirect
                alert("AUTHORIZATION GRANTED: Redirecting to Dashboard...");
                window.location.href = 'index.html'; // Sidha main page par jane ke liye
            } else {
                alert("ERROR: Invalid Credentials.");
            }
        }
    </script>
</body>
</html>
