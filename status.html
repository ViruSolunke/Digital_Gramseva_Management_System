<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Application Status | Gram Panchayat Portal</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

</head>

<body class="bg-gray-50 font-sans">

<!-- Navbar -->

<nav class="bg-blue-900 text-white p-4 shadow-lg">
<div class="max-w-7xl mx-auto flex justify-between items-center">

<div class="flex items-center gap-2">
<i class="fas fa-search text-orange-400"></i>
<span class="font-bold uppercase tracking-tight">Application Tracking</span>
</div>

<a href="dashboard.html" class="text-sm bg-blue-800 px-4 py-1 rounded hover:bg-blue-700">
Back to Dashboard
</a>

</div>
</nav>

<!-- Main Section -->

<main class="max-w-4xl mx-auto py-12 px-6">

<div class="bg-white rounded-2xl shadow-xl border overflow-hidden">

<div class="bg-gray-50 border-b p-6">
<h2 class="text-lg font-bold text-gray-700 uppercase">
<i class="fas fa-id-card mr-2"></i> Track Your Application
</h2>
</div>

<div class="p-8">

<form class="grid md:grid-cols-2 gap-6">

<div>
<label class="text-xs font-bold text-gray-400 uppercase">Application ID</label>
<input type="text" placeholder="Enter Application ID"
class="w-full mt-2 p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">
</div>

<div>
<label class="text-xs font-bold text-gray-400 uppercase">Mobile Number</label>
<input type="text" placeholder="Enter Mobile Number"
class="w-full mt-2 p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">
</div>

<div class="md:col-span-2 text-center mt-4">

<button class="bg-blue-700 text-white px-8 py-3 rounded-lg font-bold hover:bg-blue-800 transition">
<i class="fas fa-search mr-2"></i> Check Status
</button>

</div>

</form>

</div>

</div>

<!-- Status Result -->

<div class="mt-10 bg-white rounded-2xl shadow-xl border overflow-hidden">

<div class="bg-gray-50 border-b p-6 flex justify-between items-center">
<h3 class="font-bold text-gray-700 uppercase">
<i class="fas fa-list mr-2"></i> Application Details
</h3>
</div>

<div class="p-6">

<div class="grid md:grid-cols-2 gap-6 text-sm">

<div>
<p class="text-gray-400 font-bold uppercase text-xs">Application ID</p>
<p class="font-bold text-gray-800">#GP98231</p>
</div>

<div>
<p class="text-gray-400 font-bold uppercase text-xs">Service</p>
<p class="font-bold text-gray-800">Birth Certificate</p>
</div>

<div>
<p class="text-gray-400 font-bold uppercase text-xs">Date Applied</p>
<p class="font-bold text-gray-800">02 Jan 2026</p>
</div>

<div>
<p class="text-gray-400 font-bold uppercase text-xs">Status</p>
<span class="bg-yellow-100 text-yellow-700 px-3 py-1 rounded-full text-[10px] font-bold uppercase">
Pending
</span>
</div>

</div>

</div>

</div>

<!-- Help Section -->

<div class="mt-10 bg-blue-50 p-6 rounded-2xl border-2 border-dashed border-blue-200 text-center">

<p class="text-sm text-blue-700">
<i class="fas fa-info-circle mr-2"></i>
If your application remains pending for more than <strong>7 days</strong>, please contact the <strong>Gram Panchayat Office</strong>.
</p>

</div>

</main>

</body>
</html>
